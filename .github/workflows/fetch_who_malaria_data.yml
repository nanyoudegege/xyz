name: Fetch WHO malaria vaccine data

on:
  push:
    paths:
      - '.github/workflows/fetch_who_malaria_data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch WHO pages and data files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact/raw artifact/pages artifact/csv artifact/meta

          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.who.int/observatories/global-observatory-on-health-research-and-development/monitoring/who-review-of-malaria-vaccine-clinical-development' \
            -o artifact/pages/june2026.html
          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.who.int/observatories/global-observatory-on-health-research-and-development/monitoring/who-review-of-malaria-vaccine-clinical-development-(mar2024)' \
            -o artifact/pages/march2024.html
          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.who.int/observatories/global-observatory-on-health-research-and-development/monitoring/who-review-of-malaria-vaccine-clinical-development-nov-2022' \
            -o artifact/pages/nov2022.html
          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.who.int/observatories/global-observatory-on-health-research-and-development/monitoring/who-review-of-malaria-vaccine-clinical-development-(apr-2025)' \
            -o artifact/pages/apr2025.html || true

          curl -L --fail --retry 5 --retry-all-errors \
            'https://cdn.who.int/media/docs/default-source/global-observatory-on-health-r-d/who_malaria_vaccines_pipeline_data_download_june2026.xlsx?sfvrsn=291568be_1' \
            -o artifact/raw/who_dec2025.xlsx
          curl -L --fail --retry 5 --retry-all-errors \
            'https://cdn.who.int/media/docs/default-source/global-observatory-on-health-r-d/who_malaria_vaccines_pipeline_data_download_march2024.xlsx?sfvrsn=6a520a7c_3' \
            -o artifact/raw/who_dec2023.xlsx
          curl -L --fail --retry 5 --retry-all-errors \
            'https://cdn.who.int/media/docs/default-source/global-observatory-on-health-r-d/who_malaria_vaccines_pipeline_data_download_july2022.xlsx?sfvrsn=cf739119_1' \
            -o artifact/raw/who_july2022.xlsx

          python - <<'PY'
          import html, pathlib, re, urllib.parse, urllib.request
          p = pathlib.Path('artifact/pages/apr2025.html')
          if p.exists():
              text = html.unescape(p.read_text(errors='ignore'))
              urls = set(re.findall(r'https?://[^\"\'<> ]+?\.xlsx(?:\?[^\"\'<> ]*)?', text, flags=re.I))
              pathlib.Path('artifact/meta/apr2025_xlsx_links.txt').write_text('\n'.join(sorted(urls)))
              for i, u in enumerate(sorted(urls), 1):
                  try:
                      urllib.request.urlretrieve(u, f'artifact/raw/apr2025_link_{i}.xlsx')
                  except Exception as e:
                      pathlib.Path(f'artifact/meta/apr2025_link_{i}_error.txt').write_text(repr(e))
          PY

      - name: Convert workbooks to CSV and inventory fields
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pandas openpyxl
          python - <<'PY'
          import hashlib, json, pathlib, re
          import pandas as pd
          root = pathlib.Path('artifact')
          inventory=[]
          for path in sorted((root/'raw').glob('*.xlsx')):
              b=path.read_bytes()
              rec={'file':path.name,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'sheets':[]}
              try:
                  xls=pd.ExcelFile(path)
                  for s in xls.sheet_names:
                      df=pd.read_excel(path,sheet_name=s,header=None,dtype=object)
                      safe=re.sub(r'[^A-Za-z0-9_.-]+','_',s).strip('_') or 'sheet'
                      out=root/'csv'/f'{path.stem}__{safe}.csv'
                      df.to_csv(out,index=False,header=False)
                      rec['sheets'].append({'name':s,'rows':int(df.shape[0]),'cols':int(df.shape[1]),'csv':out.name,'preview':df.head(12).fillna('').astype(str).values.tolist()})
              except Exception as e:
                  rec['error']=repr(e)
              inventory.append(rec)
          (root/'meta'/'workbook_inventory.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2))
          (root/'meta'/'sha256sums.txt').write_text('\n'.join(f"{r['sha256']}  {r['file']}" for r in inventory))
          PY

      - name: Upload fetched data
        uses: actions/upload-artifact@v4
        with:
          name: who-malaria-vaccine-data
          path: artifact
          if-no-files-found: error
          retention-days: 7
