name: Fetch WHO malaria pipeline workbooks

on:
  push:
    branches:
      - who-malaria-data-fetch-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official WHO workbooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          download() {
            local label="$1"
            local url="$2"
            local outfile="out/${label}.xlsx"
            echo "Downloading ${label} from ${url}"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 180 \
              -A 'Mozilla/5.0 (compatible; reproducibility-research/1.0)' \
              "$url" -o "$outfile"
          }

          download "who_malaria_pipeline_july2022" \
            "https://cdn.who.int/media/docs/default-source/global-observatory-on-health-r-d/who_malaria_vaccines_pipeline_data_download_july2022.xlsx?sfvrsn=cf739119_1"
          download "who_malaria_pipeline_march2024" \
            "https://cdn.who.int/media/docs/default-source/global-observatory-on-health-r-d/who_malaria_vaccines_pipeline_data_download_march2024.xlsx?sfvrsn=6a520a7c_3"
          download "who_malaria_pipeline_june2026" \
            "https://cdn.who.int/media/docs/default-source/global-observatory-on-health-r-d/who_malaria_vaccines_pipeline_data_download_june2026.xlsx?sfvrsn=291568be_1"

          APR_PAGE='https://www.who.int/observatories/global-observatory-on-health-research-and-development/monitoring/who-review-of-malaria-vaccine-clinical-development-%28apr-2025%29'
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' "$APR_PAGE" -o out/april2025_page.html || true

          APR_URL=''
          if [[ -s out/april2025_page.html ]]; then
            APR_URL=$(python - <<'PY'
          import html, re
          from pathlib import Path
          text = html.unescape(Path('out/april2025_page.html').read_text('utf-8', errors='ignore'))
          urls = re.findall(r'https://cdn\.who\.int/[^\"\'<> ]+?\.xlsx(?:\?[^\"\'<> ]*)?', text, flags=re.I)
          preferred = [u for u in urls if 'malaria' in u.lower() and ('2025' in u.lower() or 'december2024' in u.lower() or 'dec2024' in u.lower())]
          print((preferred or urls or [''])[0])
          PY
          )
          fi

          if [[ -n "$APR_URL" ]]; then
            echo "Workbook link exposed by the current April 2025 endpoint: $APR_URL"
            curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' "$APR_URL" -o out/who_malaria_pipeline_april2025_endpoint.xlsx || true
          fi

          printf '%s\n' "$APR_URL" > out/april2025_endpoint_download_url.txt

      - name: Validate and inventory workbooks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          out = Path('out')
          records = []
          for path in sorted(out.glob('*.xlsx')):
              data = path.read_bytes()
              rec = {
                  'filename': path.name,
                  'size_bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'zip_valid': zipfile.is_zipfile(path),
              }
              if rec['zip_valid']:
                  with zipfile.ZipFile(path) as zf:
                      names = zf.namelist()
                  rec['contains_workbook_xml'] = 'xl/workbook.xml' in names
                  rec['zip_member_count'] = len(names)
                  rec['first_members'] = names[:25]
              records.append(rec)

          by_name = {r['filename']: r for r in records}
          apr = by_name.get('who_malaria_pipeline_april2025_endpoint.xlsx')
          jul = by_name.get('who_malaria_pipeline_july2022.xlsx')
          if apr and jul:
              apr['byte_identical_to_july2022'] = apr['sha256'] == jul['sha256']

          (out / 'workbook_manifest.json').write_text(
              json.dumps(records, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          print(json.dumps(records, indent=2, ensure_ascii=False))

          required = {
              'who_malaria_pipeline_july2022.xlsx',
              'who_malaria_pipeline_march2024.xlsx',
              'who_malaria_pipeline_june2026.xlsx',
          }
          present = {
              r['filename'] for r in records
              if r.get('zip_valid') and r.get('contains_workbook_xml')
          }
          missing = required - present
          if missing:
              raise SystemExit(f'Missing required workbooks: {sorted(missing)}')
          PY
          sha256sum out/*.xlsx > out/SHA256SUMS.txt

      - name: Upload workbooks and manifest
        uses: actions/upload-artifact@v4
        with:
          name: who-malaria-pipeline-workbooks
          path: out/
          if-no-files-found: error
          retention-days: 7
