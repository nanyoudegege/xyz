name: Inspect WHO April 2025 archive links

on:
  push:
    branches:
      - research/malaria-pipeline-draft
    paths:
      - .github/workflows/inspect-who-apr2025.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect page source and candidate links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, requests
          from bs4 import BeautifulSoup

          url = 'https://www.who.int/observatories/global-observatory-on-health-research-and-development/monitoring/who-review-of-malaria-vaccine-clinical-development-(apr-2025)'
          r = requests.get(url, timeout=60, headers={'User-Agent':'Mozilla/5.0 reproducible academic research'})
          r.raise_for_status()
          html = r.text
          soup = BeautifulSoup(html, 'html.parser')
          anchors = []
          for a in soup.find_all('a', href=True):
              href = urljoin(r.url, a['href']).replace('&amp;', '&')
              text = a.get_text(' ', strip=True)
              if any(x in (href + ' ' + text).lower() for x in ['xlsx', 'download data', 'malaria_vaccines_pipeline']):
                  anchors.append({'text': text, 'href': href})
          regex_urls = sorted(set(x.replace('&amp;', '&') for x in re.findall(r'https?://[^"\'<> ]+?(?:\.xlsx|\.xls)[^"\'<> ]*', html, flags=re.I)))
          relative_matches = sorted(set(x.replace('&amp;', '&') for x in re.findall(r'[^"\'<> ]+?(?:\.xlsx|\.xls)[^"\'<> ]*', html, flags=re.I)))
          out = {
              'requested_url': url,
              'resolved_url': r.url,
              'status': r.status_code,
              'bytes': len(r.content),
              'title': soup.title.get_text(' ', strip=True) if soup.title else None,
              'visible_heading': soup.find('h1').get_text(' ', strip=True) if soup.find('h1') else None,
              'anchors': anchors,
              'regex_urls': regex_urls,
              'relative_matches': relative_matches,
          }
          Path('data/history').mkdir(parents=True, exist_ok=True)
          Path('data/history/apr2025_link_inspection.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('data/history/apr2025_page.html').write_text(html, encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Commit inspection results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/apr2025_link_inspection.json data/history/apr2025_page.html
          git commit -m 'data: inspect WHO April 2025 archive links [skip ci]' || exit 0
          git push
